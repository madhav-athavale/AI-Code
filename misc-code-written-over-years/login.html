<!DOCTYPE html>
<html>
<head>
    <title>Google Login Experiment</title>
    <!-- Load the Google Identity Services library -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
    <h1>Login Experiment</h1>

    <!-- 1. The Sign-In Button Placeholder -->
    <div id="buttonDiv"></div>

    <script>
        // 2. This function runs after the user logs in
        function handleCredentialResponse(response) {
            console.log("Encoded JWT ID token: " + response.credential);
            
            // The response.credential is a JWT (like we saw in Python)
            // Let's decode it to see the user's info
            const responsePayload = decodeJwtResponse(response.credential);
            console.log("Full Decoded Payload:", responsePayload); // ADD THIS LINE

            console.log("ID: " + responsePayload.sub);
            console.log("Full Name: " + responsePayload.name);
            console.log("Email: " + responsePayload.email);
            
            alert("Welcome, " + responsePayload.name + " (" + responsePayload.email + ")");
        }

        // 3. Helper function to decode the JWT (JSON Web Token)
        function decodeJwtResponse(token) {
            var base64Url = token.split('.')[1];
            var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));

            return JSON.parse(jsonPayload);
        }

        // 4. Initialize the Google Login on window load
        window.onload = function () {
            google.accounts.id.initialize({
                client_id: "428175064248-pban8qbs4g61ohdgcs07ee5s3vt2coag.apps.googleusercontent.com",
                callback: handleCredentialResponse
            });
            
            google.accounts.id.renderButton(
                document.getElementById("buttonDiv"),
                { theme: "outline", size: "large" }  // Customization attributes
            );
            
            google.accounts.id.prompt(); // Also display the One Tap dialog
        }
    </script>
</body>
</html>
